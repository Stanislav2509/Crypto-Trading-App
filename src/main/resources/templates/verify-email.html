<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify Email</title>
    <link rel="stylesheet" th:href="@{/css/verify-email.css}">
</head>
<body>

<div class="verify-page">
    <div class="verify-card">

        <div class="verify-icon">
            ✉️
        </div>

        <h1>Verify your email</h1>

        <p class="verify-text">
            We sent a 6-digit verification code to:
        </p>

        <p class="email-text" th:text="${email}"></p>

        <form th:action="@{/verify-email}" method="post" class="verify-form">

            <input type="hidden" name="email" th:value="${email}">

            <label for="code">Verification code</label>

            <input type="text" id="code" name="code" maxlength="6" placeholder="Enter 6-digit code" required>

            <p class="error-message" th:if="${hasVerificationError}">
                Invalid or expired verification code.
            </p>

            <button type="submit">Verify Account</button>
        </form>

        <form th:action="@{/resend-verification-code}" method="post" class="resend-form">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="resend-button">Send new code</button>
        </form>


        <a href="/register" class="back-link">Back to registration</a>

    </div>
</div>

</body>
</html>
